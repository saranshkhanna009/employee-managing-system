services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:?DB_NAME must be set}"
      POSTGRES_USER: "${DB_USER:?DB_USER must be set}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q '^PONG$'"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: "postgresql+asyncpg://${DB_USER:?DB_USER must be set}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/${DB_NAME:?DB_NAME must be set}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0"
      ENCRYPTION_MASTER_KEY: "${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY must be set}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set}"
      ENVIRONMENT: "${ENVIRONMENT:?ENVIRONMENT must be set}"
      DEBUG: "${DEBUG:?DEBUG must be set}"
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS must be set as a JSON array}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_TLS: "${SMTP_TLS:-true}"
      FROM_EMAIL: "${FROM_EMAIL:?FROM_EMAIL must be set}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:?SESSION_COOKIE_SECURE must be set}"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:?SESSION_COOKIE_NAME must be set}"
      SESSION_COOKIE_SAMESITE: "${SESSION_COOKIE_SAMESITE:?SESSION_COOKIE_SAMESITE must be set}"
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://${DB_USER:?DB_USER must be set}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/${DB_NAME:?DB_NAME must be set}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0"
      ENCRYPTION_MASTER_KEY: "${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY must be set}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set}"
      ENVIRONMENT: "${ENVIRONMENT:?ENVIRONMENT must be set}"
      DEBUG: "${DEBUG:?DEBUG must be set}"
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS must be set as a JSON array}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_TLS: "${SMTP_TLS:-true}"
      FROM_EMAIL: "${FROM_EMAIL:?FROM_EMAIL must be set}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:?SESSION_COOKIE_SECURE must be set}"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:?SESSION_COOKIE_NAME must be set}"
      SESSION_COOKIE_SAMESITE: "${SESSION_COOKIE_SAMESITE:?SESSION_COOKIE_SAMESITE must be set}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8000/health >/dev/null"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:?VITE_API_URL must be set at build time}"
    restart: unless-stopped
    networks:
      - external
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.27.0-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:?HTTP_PORT must be set}:80"
    environment:
      TLS_TERMINATION: "${TLS_TERMINATION:?TLS_TERMINATION must be set to external}"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    command:
      - /bin/sh
      - -ec
      - |
        test "$${TLS_TERMINATION}" = external
        exec nginx -g "daemon off;"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - external

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge
