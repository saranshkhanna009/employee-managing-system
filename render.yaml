services:
  - type: web
    name: employee-tracker-api
    runtime: docker
    # Use Render's current free web-service plan. Change this in the dashboard
    # if the application needs more capacity.
    plan: free
    rootDir: backend
    # Docker paths and commands are relative to rootDir.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # The database is created by this Blueprint. Other sync:false values are
      # entered in the Render dashboard and remain outside source control.
      - key: DATABASE_URL
        fromDatabase:
          name: employee-tracker-db
          property: connectionString
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_HTTPONLY
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: FROM_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_TLS
        value: "true"
      # Free web services do not support pre-deploy commands. Run the
      # idempotent Alembic migration before Gunicorn starts instead.
      - key: RUN_MIGRATIONS
        value: "true"

databases:
  - name: employee-tracker-db
    postgresMajorVersion: "16"
    databaseName: employee_tracker
    user: employee_user
    plan: free
